; =====================================================
; AIRA ESP32-CAM — PlatformIO Configuration
; =====================================================
[env:esp32cam]
platform  = espressif32
board     = esp32cam
framework = arduino

; Serial monitor (must match SERIAL_BAUD in main.cpp)
monitor_speed = 460800

; Upload via UART (GPIO 0 must be pulled LOW during flash)
upload_speed = 921600

; No extra lib deps — esp_camera is part of the ESP-IDF/Arduino core
